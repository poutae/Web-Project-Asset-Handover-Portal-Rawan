name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, format, tests)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Portal.slnx
      - name: Build
        run: dotnet build Portal.slnx -c Release --no-restore
      - name: Format
        run: dotnet format Portal.slnx --verify-no-changes --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb versions
          sqllocaldb create MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Backend tests
        env:
          PORTAL_TEST_CONNECTION: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true
        run: dotnet test --solution Portal.slnx -c Release --no-build

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright, two tabs)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build the API
        run: dotnet build backend/Portal.slnx -c Release
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium
      - name: E2E typecheck
        working-directory: e2e
        run: npm run typecheck
      - name: E2E tests
        working-directory: e2e
        env:
          E2E_SQL_SERVER: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true
        run: npx playwright test
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
